name: Release Firmware

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Get version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ESP-IDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3-pip python3-venv cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0

      - name: Setup ESP-IDF
        run: |
          mkdir -p ~/esp
          cd ~/esp
          git clone -b v5.3.1 --recursive https://github.com/espressif/esp-idf.git
          cd esp-idf
          ./install.sh esp32s3
          echo "IDF_PATH=$HOME/esp/esp-idf" >> $GITHUB_ENV

      - name: Debug directory structure
        run: |
          echo "Current directory:"
          pwd
          echo "Repository contents:"
          ls -la
          echo "Firmware directory contents:"
          ls -la firmware/ || echo "Firmware directory not found!"
          echo "IDF_PATH: $IDF_PATH"

      - name: Build firmware
        working-directory: firmware
        shell: bash
        run: |
          . $HOME/esp/esp-idf/export.sh
          idf.py set-target esp32s3
          idf.py build

      - name: Prepare release binaries
        working-directory: firmware/build
        shell: bash
        run: |
          VERSION=${{ steps.get_version.outputs.version }}

          # Rename main firmware with version
          if [ -f "track-robot.bin" ]; then
            cp track-robot.bin track-robot-${VERSION}.bin
          fi

          # Create merged firmware (all-in-one binary)
          # Merge bootloader + partition table + app into single binary at offset 0x0
          python -m esptool --chip esp32s3 merge_bin \
            -o merged-firmware-${VERSION}.bin \
            --flash_mode qio --flash_freq 80m --flash_size 8MB \
            0x0 bootloader/bootloader.bin \
            0x8000 partition_table/partition-table.bin \
            0x10000 track-robot.bin

          echo "Release binaries prepared:"
          ls -lh *.bin

      - name: Generate manifest.json
        working-directory: firmware/build
        run: |
          VERSION=${{ steps.get_version.outputs.version }}

          cat > manifest.json <<EOF
          {
            "name": "Track Robot Firmware",
            "version": "${VERSION}",
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [
                  {
                    "path": "bootloader.bin",
                    "offset": 0
                  },
                  {
                    "path": "partition-table.bin",
                    "offset": 32768
                  },
                  {
                    "path": "track-robot-${VERSION}.bin",
                    "offset": 65536
                  }
                ]
              }
            ]
          }
          EOF

          echo "Manifest generated:"
          cat manifest.json

      - name: Create release notes
        id: release_notes
        run: |
          VERSION=${{ steps.get_version.outputs.version }}

          cat > release-notes.md <<EOF
          # Track Robot Firmware ${VERSION}

          ## What's New

          This release includes firmware for ESP32-S3 tracked robot controller with full PS3 support!

          ## Hardware

          - **MCU**: ESP32-S3 (Heltec WiFi Kit 32 V3 recommended)
          - **Motors**: 2x DC motors with BTS7960 H-bridge drivers
          - **Power**: 12V battery
          - **Controller**: PS3 DualShock (Bluetooth Classic) OR Serial/HTTP

          ## Installation

          ### Option 1: Web Flasher (Easiest)
          Visit https://joachimth.github.io/track-robot/ and click "Install"

          ### Option 2: esptool.py
          \`\`\`bash
          esptool.py --chip esp32s3 --port /dev/ttyUSB0 write_flash 0x0 merged-firmware-${VERSION}.bin
          \`\`\`

          ### Option 3: ESP-IDF
          \`\`\`bash
          esptool.py --chip esp32s3 --port /dev/ttyUSB0 write_flash \\
            0x0 bootloader.bin \\
            0x8000 partition-table.bin \\
            0x10000 track-robot-${VERSION}.bin
          \`\`\`

          ## Files

          - \`merged-firmware-${VERSION}.bin\` - All-in-one binary (recommended)
          - \`track-robot-${VERSION}.bin\` - Main application
          - \`bootloader.bin\` - ESP32 bootloader
          - \`partition-table.bin\` - Partition layout
          - \`manifest.json\` - Web flasher metadata

          ## PS3 Controller Pairing

          1. Flash firmware and note the ESP32 MAC address from serial console
          2. Use SixaxisPairTool to set controller master address to ESP32 MAC
          3. Press PS button to connect

          See README.md for full documentation and pairing instructions.
          EOF

          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.get_version.outputs.version }}
          body_path: release-notes.md
          files: |
            firmware/build/merged-firmware-${{ steps.get_version.outputs.version }}.bin
            firmware/build/track-robot-${{ steps.get_version.outputs.version }}.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/manifest.json
          draft: false
          prerelease: false

      - name: Update web flasher
        run: |
          VERSION=${{ steps.get_version.outputs.version }}

          # Create version directory
          mkdir -p web-flasher/firmware/${VERSION}

          # Copy binaries
          cp firmware/build/merged-firmware-${VERSION}.bin web-flasher/firmware/${VERSION}/
          cp firmware/build/bootloader/bootloader.bin web-flasher/firmware/${VERSION}/
          cp firmware/build/partition_table/partition-table.bin web-flasher/firmware/${VERSION}/
          cp firmware/build/track-robot-${VERSION}.bin web-flasher/firmware/${VERSION}/
          cp firmware/build/manifest.json web-flasher/firmware/${VERSION}/

          # Update versions.json (for web flasher version selector)
          cat > web-flasher/versions.json <<EOF
          {
            "latest": "${VERSION}",
            "versions": [
              {
                "version": "${VERSION}",
                "date": "$(date -I)",
                "manifest": "firmware/${VERSION}/manifest.json"
              }
            ]
          }
          EOF

          echo "Web flasher updated with ${VERSION}"

      - name: Commit web flasher updates
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add web-flasher/
          git diff --staged --quiet || git commit -m "Release ${{ steps.get_version.outputs.version }}: Update web flasher"
          git push origin HEAD:main || echo "No changes to push"

      - name: Release summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.get_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Target**: ESP32-S3 (Heltec WiFi Kit 32 V3)" >> $GITHUB_STEP_SUMMARY
          echo "- **Controller**: PS3 DualShock (Bluetooth Classic)" >> $GITHUB_STEP_SUMMARY
          echo "- **Release**: https://github.com/${{ github.repository }}/releases/tag/${{ steps.get_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Web Flasher**: https://joachimth.github.io/track-robot/" >> $GITHUB_STEP_SUMMARY
