name: Build Firmware

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ESP-IDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3-pip python3-venv cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0

      - name: Setup ESP-IDF
        run: |
          mkdir -p ~/esp
          cd ~/esp
          git clone -b v5.3.1 --recursive https://github.com/espressif/esp-idf.git
          cd esp-idf
          ./install.sh esp32s3
          echo "IDF_PATH=$HOME/esp/esp-idf" >> $GITHUB_ENV

      - name: Debug directory structure
        run: |
          echo "Current directory:"
          pwd
          echo "Repository contents:"
          ls -la
          echo "Firmware directory contents:"
          ls -la firmware/ || echo "Firmware directory not found!"
          echo "Checking for CMakeLists.txt:"
          find . -name "CMakeLists.txt" -type f
          echo "IDF_PATH: $IDF_PATH"

      - name: Build firmware
        working-directory: firmware
        shell: bash
        run: |
          . $HOME/esp/esp-idf/export.sh
          idf.py set-target esp32s3
          idf.py build

      - name: List build artifacts
        working-directory: firmware/build
        run: |
          ls -lh *.bin || true
          echo "Build complete!"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: |
            firmware/build/*.bin
            firmware/build/*.elf
            firmware/build/*.map
          retention-days: 90

      - name: Build summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Target**: ESP32-S3 (Heltec WiFi Kit 32 V3)" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Firmware Binaries" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          ls -lh firmware/build/*.bin 2>/dev/null || echo "No binaries found"
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
